name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Standalone Single-File EXE
      run: |
        dotnet publish src/SmartCalendar.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --self-contained true -o dist/standalone
        cp config.example.json dist/standalone/config.json
        rm -Force dist/standalone/*.pdb

    - name: Build Lightweight Single-File EXE
      run: |
        dotnet publish src/SmartCalendar.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o dist/light
        cp config.example.json dist/light/config.json
        rm -Force dist/light/*.pdb

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmartCalendar-Build
        path: dist/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/standalone/SmartCalendar.exe
          dist/light/SmartCalendar.exe
          config.example.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
