name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Standalone Version (Zero Dependencies)
      shell: pwsh
      run: |
        dotnet publish src/SmartCalendar.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --self-contained true -o dist/standalone
        Copy-Item config.example.json dist/standalone/config.json
        Remove-Item -Force dist/standalone/*.pdb -ErrorAction SilentlyContinue
        Compress-Archive -Path dist/standalone/* -DestinationPath dist/SmartCalendar-${{ github.ref_name }}-win-x64-standalone.zip

    - name: Build Lightweight Version (Requires .NET 9 Desktop Runtime)
      shell: pwsh
      run: |
        dotnet publish src/SmartCalendar.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o dist/light
        Copy-Item config.example.json dist/light/config.json
        Remove-Item -Force dist/light/*.pdb -ErrorAction SilentlyContinue
        Compress-Archive -Path dist/light/* -DestinationPath dist/SmartCalendar-${{ github.ref_name }}-win-x64-light.zip

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: SmartCalendar ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ### 📅 SmartCalendar ${{ github.ref_name }} 发布日志

          智能入历是一个原生的 Windows 轻量后台应用：复制日程文本后，默认按 Ctrl + Alt + F11 识别并添加至 Outlook。

          #### 📦 下载指南：
          - **`SmartCalendar-...-standalone.zip` (推荐)**：免安装独立版，内置运行库，任何 Win10/Win11 电脑开箱即用，解压即可运行。
          - **`SmartCalendar-...-light.zip`**：超轻量版，需要电脑已安装 .NET 9 Desktop Runtime。

          #### 🚀 使用步骤：
          1. 下载对应 `.zip` 压缩包并解压到任意文件夹。
          2. 打开 `config.json`，填入你的免费 [智谱 API Key](https://open.bigmodel.cn)。
          3. 双击运行 `SmartCalendar.exe`。
          4. 复制日程文本后按 Ctrl + Alt + F11。右键托盘图标选择「设置快捷键」，可自定义、恢复默认，或清空后改为复制时自动识别。

          #### 📱 iPhone 快捷指令
          - [添加豆包版快捷指令](https://www.icloud.com/shortcuts/c8f09aa23c504964946a427d21ebb934)，通过豆包 App 解析文本，无需填写 API Key。
        files: |
          dist/SmartCalendar-*.zip
          config.example.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
